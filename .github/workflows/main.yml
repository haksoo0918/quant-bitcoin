name: Crypto Quantitative Trading Signal Bot

on:
  schedule:
    # 매일 오전 09:05 KST 실행 (UTC 00:05)
    - cron: '5 0 * * *'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Quantitative Signal Logic
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python src/main.py --signal-only

    - name: Commit and push updated status.json
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/data/status.json
        git diff-index --quiet HEAD || (git commit -m "chore(data): 일일 전략 상태 데이터 자동 업데이트 [skip ci]" && git push)

