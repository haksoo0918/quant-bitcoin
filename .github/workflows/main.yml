name: Crypto Quantitative Trading Bot

on:
  schedule:
    # 매일 00:05 UTC (한국시간 09:05 KST)에 실행
    - cron: '5 0 * * *'
  workflow_dispatch:
    # GitHub 웹 UI에서 수동으로 실행 가능하도록 설정

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 자동 매매 프로그램 실행 (main.py)
        env:
          # GitHub Secrets에 등록한 인증 키들을 환경 변수로 바인딩
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          BITHUMB_ACCESS_KEY: ${{ secrets.BITHUMB_ACCESS_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 드라이런 모드를 False로 설정하여 실제 주문을 활성화 (필요 시 Secrets이나 변수로 관리 가능)
          DRY_RUN: 'False'
        run: |
          python main.py
