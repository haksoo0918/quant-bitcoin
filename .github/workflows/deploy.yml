name: Deploy to Oracle Cloud VM

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 수동 원클릭 배포 지원
    inputs:
      run_mode:
        description: '오라클 VM 배포 직후 실행 모드 (live: 실거래 및 리포팅, dry-run: 모의매매)'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - dry-run

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (Quality Gate)
      run: |
        python -m pytest tests/

    - name: Deploy to Oracle Cloud VM via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ${{ secrets.ORACLE_USER }}
        key: ${{ secrets.ORACLE_SSH_KEY }}
        script: |
          cd /home/ubuntu/quant-bitcoin
          git pull origin main
          pip install -r requirements.txt --break-system-packages
          (crontab -l 2>/dev/null | grep -v 'quant-bitcoin'; echo "5 9 * * * cd /home/ubuntu/quant-bitcoin && git pull origin main >> /home/ubuntu/quant-bitcoin/cron.log 2>&1; /usr/bin/python3 src/main.py --live >> /home/ubuntu/quant-bitcoin/cron.log 2>&1") | crontab -
          RUN_MODE="${{ github.event.inputs.run_mode }}"
          if [ -z "$RUN_MODE" ]; then
            RUN_MODE="live"
          fi
          echo "Executing: python3 src/main.py --$RUN_MODE"
          python3 src/main.py --$RUN_MODE
