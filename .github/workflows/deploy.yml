name: Deploy to Oracle Cloud VM

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 수동 원클릭 배포 지원
    inputs:
      run_mode:
        description: '오라클 VM 배포 직후 실행 모드 (none: 실행 안 함, live: 실거래, dry-run: 모의매매)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - live
          - dry-run

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (Quality Gate)
      run: |
        python -m pytest tests/

    - name: Deploy to Oracle Cloud VM via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ${{ secrets.ORACLE_USER }}
        key: ${{ secrets.ORACLE_SSH_KEY }}
        script: |
          cd /home/ubuntu/quant-bitcoin
          # 이전 잔여 rebase/merge 충돌 상태 정리
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          # 로컬 실거래 장부 데이터 보존 커밋
          git add docs/data/status.json data/trade_history.csv data/asset_history.csv 2>/dev/null || true
          git commit -m "data: local ledger snapshot before pull" 2>/dev/null || true
          # 최신 원격 main 브랜치와 안전하게 동기화
          git fetch origin main
          git rebase -X theirs origin/main || (git rebase --abort; git pull --no-rebase -X theirs origin main --no-edit) || true
          pip install -r requirements.txt --break-system-packages
          (crontab -l 2>/dev/null | grep -v 'quant-bitcoin'; echo "5 9 * * * cd /home/ubuntu/quant-bitcoin && (git fetch origin main && git rebase -X theirs origin/main || git pull --no-rebase -X theirs origin main --no-edit) >> /home/ubuntu/quant-bitcoin/cron.log 2>&1; /usr/bin/python3 src/main.py --live >> /home/ubuntu/quant-bitcoin/cron.log 2>&1") | crontab -
          RUN_MODE="${{ github.event.inputs.run_mode }}"
          if [ -n "$RUN_MODE" ] && [ "$RUN_MODE" != "none" ]; then
            echo "Executing: python3 src/main.py --$RUN_MODE"
            python3 src/main.py --$RUN_MODE
          fi

    - name: Sync updated data files from Oracle VM
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
        mkdir -p ./docs/data ./data
        scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/home/ubuntu/quant-bitcoin/docs/data/status.json ./docs/data/status.json || true
        scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/home/ubuntu/quant-bitcoin/data/trade_history.csv ./data/trade_history.csv || true
        scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/home/ubuntu/quant-bitcoin/data/asset_history.csv ./data/asset_history.csv || true

    - name: Commit and push updated dashboard data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/status.json data/trade_history.csv data/asset_history.csv
        if ! git diff --staged --quiet; then
          today_str=$(date +'%Y-%m-%d')
          git commit -m "data: 오라클 VM 실거래 장부 및 대시보드 자동 동기화 ($today_str)"
          git push origin main
        else
          echo "No changes to commit from Oracle VM data."
        fi
