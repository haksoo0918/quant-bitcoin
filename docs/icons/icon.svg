<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="btc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#accent-grad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Trend Line / Pulse Chart -->
  <path d="M 80 340 L 170 290 L 230 330 L 320 210 L 390 250 L 440 140" fill="none" stroke="url(#accent-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Quant Quantum Diamond / Bitcoin Mark -->
  <circle cx="440" cy="140" r="22" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Center Emblem -->
  <g transform="translate(256, 256)">
    <circle r="76" fill="url(#btc-grad)" filter="url(#glow)"/>
    <path d="M -16 -42 L 14 -42 C 28 -42 38 -34 38 -20 C 38 -10 32 -3 22 0 C 34 3 42 12 42 26 C 42 42 30 50 14 50 L -16 50 Z M -2 -24 L 10 -24 C 18 -24 22 -20 22 -14 C 22 -8 18 -4 10 -4 L -2 -4 Z M -2 14 L 12 14 C 20 14 26 18 26 26 C 26 34 20 38 12 38 L -2 38 Z" fill="#ffffff"/>
    <line x1="-2" y1="-52" x2="-2" y2="-42" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="-52" x2="16" y2="-42" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="-2" y1="50" x2="-2" y2="60" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="50" x2="16" y2="60" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
