<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 비트코인 그라데이션 -->
    <linearGradient id="btcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 입체감을 위한 그림자 효과 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- PWA 앱 아이콘 라운드 배경 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)" />

  <!-- 퀀트 막대 차트 및 우상향 라인 그래프 -->
  <g filter="url(#shadow)">
    <rect x="180" y="340" width="36" height="30" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="232" y="300" width="36" height="70" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="284" y="250" width="36" height="120" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="336" y="210" width="36" height="160" rx="6" fill="#FFFFFF" opacity="0.95" />
    <rect x="388" y="170" width="36" height="200" rx="6" fill="#FFFFFF" />

    <path d="M 240 260 L 285 220 L 320 235 L 400 135" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <circle cx="400" cy="135" r="12" fill="#FFFFFF" />
  </g>

  <!-- 비트코인 엠블럼 -->
  <g filter="url(#shadow)">
    <path d="
      M 115 140 H 185 
      C 215 140, 235 152, 235 180 
      C 235 200, 220 212, 202 218 
      C 226 225, 242 240, 242 268 
      C 242 300, 218 316, 185 316 
      H 115 Z
      M 148 172 V 212 H 180 
      C 192 212, 201 204, 201 192 
      C 201 180, 192 172, 180 172 Z
      M 148 244 V 284 H 184 
      C 197 284, 207 275, 207 264 
      C 207 253, 197 244, 184 244 Z" 
      fill="url(#btcGradient)" 
      fill-rule="evenodd" />

    <rect x="142" y="120" width="12" height="25" rx="4" fill="url(#btcGradient)" />
    <rect x="175" y="120" width="12" height="25" rx="4" fill="url(#btcGradient)" />
    <rect x="142" y="311" width="12" height="25" rx="4" fill="url(#btcGradient)" />
    <rect x="175" y="311" width="12" height="25" rx="4" fill="url(#btcGradient)" />
  </g>
</svg>
